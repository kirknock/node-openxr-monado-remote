# Publishes to npmjs when a GitHub release is published. The release tag must be v<package.json version>.
# Authentication uses npm trusted publishing (OIDC): no token is stored in GitHub.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or newer
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "release tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
      - name: Check whether this version is already on npm
        id: published
        run: |
          spec="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already published, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.exists != 'true'
        run: npm publish --access public # prepack runs the tests first
